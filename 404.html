<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | Coastal Reserve Properties</title>
  <meta name="robots" content="noindex" />
  <script>
    // Old /property/<slug> links (used by the booking search results) map to residence pages.
    (function () {
      var m = location.pathname.match(/^(.*?)\/property\/([^/?#]+)/);
      if (m) location.replace(m[1] + "/residence.html?r=" + encodeURIComponent(m[2]));
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07111f; color: #f3eee4; font-family: Georgia, serif; text-align: center; padding: 2rem; }
    a { color: #c9a96e; font-family: Arial, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div>
    <h1 style="font-weight: 300; font-size: 2.6rem">This page drifted out to sea.</h1>
    <p><a href="./">Back to the island</a></p>
  </div>
</body>
</html>
